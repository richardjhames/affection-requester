# Netlify config. Nothing here is required to run the site — it's a plain
# static folder — but these headers keep it out of search results and stop
# the URL leaking through referrers.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
