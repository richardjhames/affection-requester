# Deploy the site to GitHub Pages.
#
# Runs on every push to main, and can be triggered by hand from the Actions
# tab. There's nothing to build — the job just gathers the site files into
# _site/ and hands them to Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". (The configure-pages step below tries to do this for you
# on the first run, but the setting is worth checking.)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, but only queue one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Gather the site files
        # Only the site itself is published — spec.md, the README and the
        # host configs for Netlify/Vercel stay out of the deployed folder.
        run: |
          mkdir -p _site
          cp index.html robots.txt _site/
          cp -r css js img _site/
          # Tell Pages not to run the files through Jekyll.
          touch _site/.nojekyll

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
